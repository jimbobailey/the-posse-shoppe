<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affiliates | The Posse Shoppe</title>

  <meta property="og:title" content="Affiliates | The Posse Shoppe" />
  <meta property="og:description" content="Affiliate links and recommended products from The Posse Shoppe." />
  <meta property="og:url" content="https://theposseshoppe.com/affiliates.html" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://theposseshoppe.com/images/header.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Affiliates | The Posse Shoppe" />
  <meta name="twitter:description" content="Affiliate links and recommended products from The Posse Shoppe." />
  <meta name="twitter:image" content="https://theposseshoppe.com/images/header.png" />

  <link rel="icon" type="image/jpeg" href="/images/favicon.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --ink: #0b1a2e;
      --ink-2: #46566c;
      --ink-3: #7b889a;
      --line: #e1e7ef;
      --navy: #0a2540;
      --blue: #1668e3;
      --blue-2: #0f55c2;
      --sky: #3fa9f5;
      --ice: #e8f2ff;
      --ice-2: #d5e7ff;
      --danger: #d63a3a;
      --radius: 20px;
      --shadow: 0 1px 2px rgba(10, 37, 64, 0.05), 0 8px 24px rgba(10, 37, 64, 0.06);
      --shadow-lg: 0 2px 6px rgba(10, 37, 64, 0.06), 0 22px 50px rgba(10, 37, 64, 0.12);
      --max: 1200px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    img { max-width: 100%; }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(10, 37, 64, 0.08);
    }
    .topbar-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 22px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #0a2540 0%, #1668e3 60%, #3fa9f5 100%);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 10px rgba(22, 104, 227, 0.3);
    }
    .toplinks {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toplinks::-webkit-scrollbar { display: none; }
    .toplinks a {
      color: var(--ink-2);
      font-size: 14px;
      padding: 7px 13px;
      border-radius: 999px;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .toplinks a:hover { color: var(--ink); background: rgba(10, 37, 64, 0.05); }
    .toplinks a.current { color: var(--blue); background: var(--ice); font-weight: 500; }

    /* Hero */
    .hero {
      text-align: center;
      padding: 84px 22px 44px;
      background:
        radial-gradient(900px 380px at 50% -8%, #d6e8ff 0%, rgba(214, 232, 255, 0) 70%),
        radial-gradient(600px 300px at 85% 10%, rgba(63, 169, 245, 0.12) 0%, rgba(63, 169, 245, 0) 70%);
    }
    .eyebrow {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero h1 {
      font-size: clamp(40px, 6.2vw, 76px);
      line-height: 1.03;
      letter-spacing: -0.038em;
      margin: 0 auto;
      max-width: 940px;
      font-weight: 700;
      color: var(--ink);
    }
    .grad {
      background: linear-gradient(90deg, #0a2540 0%, #1668e3 50%, #3fa9f5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .lead {
      font-size: clamp(18px, 2.2vw, 22px);
      color: var(--ink-2);
      max-width: 680px;
      margin: 20px auto 0;
      letter-spacing: -0.01em;
      line-height: 1.45;
    }
    .hero-actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      font: inherit;
      font-size: 16px;
      font-weight: 500;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 6px 16px rgba(22, 104, 227, 0.28); }
    .btn-primary:hover { background: var(--blue-2); transform: translateY(-1px); }
    .btn-soft { background: var(--ice); color: var(--blue); }
    .btn-soft:hover { background: var(--ice-2); }
    .btn-link { background: transparent; color: var(--blue); padding-left: 8px; padding-right: 8px; }
    .btn-link:hover { text-decoration: underline; }

    /* Section heads */
    .section-head { text-align: center; margin: 56px 0 28px; }
    .section-head h2 {
      font-size: clamp(28px, 3.6vw, 42px);
      letter-spacing: -0.028em;
      line-height: 1.1;
      margin: 0;
    }
    .section-head p { color: var(--ink-2); margin: 10px auto 0; font-size: 17px; max-width: 620px; }

    .site-footer {
      border-top: 1px solid var(--line);
      margin-top: 72px;
      padding: 28px 22px 44px;
      color: var(--ink-3);
      font-size: 13px;
      text-align: center;
    }
    .site-footer a { color: var(--ink-2); margin: 0 8px; }
    .site-footer a:hover { color: var(--blue); }

    @media (max-width: 720px) {
      .topbar-inner { height: auto; padding: 10px 14px 8px; flex-direction: column; align-items: stretch; gap: 6px; }
      .toplinks { margin: 0 -6px; }
      .hero { padding: 52px 16px 30px; }
    }

    .page-wrap { max-width: var(--max); margin: 0 auto; padding: 0 22px; }
    body { background: radial-gradient(900px 420px at 50% -60px, #d6e8ff 0%, rgba(214, 232, 255, 0) 70%) no-repeat, var(--bg); }
    .hero-box { text-align: center; background: none; }
    .stl-grid, .affiliate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }
    .stl-card, .affiliate-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 16px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .stl-card:hover, .affiliate-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .stl-img-box, .affiliate-img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 280px;
      background: linear-gradient(180deg, #f8fbff 0%, #eaf1fb 100%);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
    }
    .stl-img-box img, .affiliate-img-box img { width: 100%; height: 100%; object-fit: contain; }
    .stl-card h3, .affiliate-card h3 { margin: 2px 4px 6px; font-size: 18px; font-weight: 600; letter-spacing: -0.012em; line-height: 1.3; }
    .stl-price { margin: 0 4px 6px; color: var(--blue); font-weight: 600; }
    .stl-card p, .affiliate-card p { margin: 0 4px 16px; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }
    .license-tag {
      align-self: flex-start;
      margin: 0 4px 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--ice);
      color: var(--blue);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .request-btn, .affiliate-btn {
      margin-top: auto;
      display: block;
      width: 100%;
      padding: 12px;
      text-align: center;
      border-radius: 999px;
      background: var(--ice);
      color: var(--blue);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .request-btn:hover, .affiliate-btn:hover { background: var(--blue); color: #fff; }
    .empty-box {
      margin: 10px auto 0;
      max-width: 560px;
      text-align: center;
      background: var(--surface);
      color: var(--ink-2);
      padding: 28px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    @media (max-width: 720px) {
      .page-wrap { padding: 0 16px; }
      .stl-grid, .affiliate-grid { grid-template-columns: 1fr; }
    }

  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">TPS</span>The Posse Shoppe</a>
      <nav class="toplinks"><a href="index.html">Shop</a><a href="stl.html">STL Files</a><a href="affiliates.html" class="current">Affiliates</a><a href="music.html">Music</a><a href="mailto:theposseshoppe@gmail.com?subject=Question%20from%20The%20Posse%20Shoppe%20Website">Contact</a></nav>
    </div>
  </header>

  <div class="page-wrap">
    <section class="hero hero-box">
      <div class="eyebrow">The Posse Shoppe</div>
      <h1><span class="grad">Affiliates.</span></h1>
      <p class="lead">Recommended Crafters.</p>
    </section>

    <div class="section-head" style="margin-top:8px;"><h2>Recommended Products</h2></div>

    <section class="affiliate-grid" id="affiliate-grid"></section>

    <div class="empty-box" id="affiliate-empty" style="display:none;">
      No affiliate items have been added yet.
    </div>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function loadAffiliateItems() {
      const grid = document.getElementById("affiliate-grid");
      const empty = document.getElementById("affiliate-empty");

      try {
        const response = await fetch("/.netlify/functions/products", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const items = (Array.isArray(data) ? data : []).filter(
          (item) => item.category === "affiliate"
        );

        if (!items.length) {
          empty.style.display = "block";
          grid.innerHTML = "";
          return;
        }

        empty.style.display = "none";

        grid.innerHTML = items.map((item) => {
          const imagePath = `/images/affiliates/${escapeHtml(item.img || "")}`;
          const link = item.link ? escapeHtml(item.link) : "#";

          return `
            <div class="affiliate-card">
              <div class="affiliate-img-box">
                <img
                  src="${imagePath}"
                  alt="${escapeHtml(item.name || "Affiliate Item")}"
                  onerror="this.onerror=null; this.src='images/header.png';"
                />
              </div>
              <h3>${escapeHtml(item.name || "")}</h3>
              <p>${escapeHtml(item.desc || "")}</p>
              <a class="affiliate-btn" href="${link}" target="_blank" rel="noopener noreferrer sponsored">Visit Link</a>
            </div>
          `;
        }).join("");
      } catch (error) {
        console.error(error);
        empty.style.display = "block";
        empty.textContent = "Could not load affiliate items right now.";
      }
    }

    window.onload = loadAffiliateItems;
  </script>
  <footer class="site-footer">
    <a href="index.html">Shop</a><a href="stl.html">STL Files</a><a href="affiliates.html">Affiliates</a><a href="music.html">Music</a><a href="mailto:theposseshoppe@gmail.com?subject=Question%20from%20The%20Posse%20Shoppe%20Website">Contact</a>
    <div style="margin-top:10px;">© The Posse Shoppe · Custom 3D prints and laser engraving</div>
  </footer>
</body>
</html>
