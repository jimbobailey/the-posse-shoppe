<script>
(function () {
  let f = new URLSearchParams(location.search).get("f") || "";
  if (f && !/\.html$/i.test(f)) f += ".html";
  const ok = /^\/lyrics\/[^?#]+\.html$/i.test(f) && !f.includes("..");
  const box = document.getElementById("lv-lyrics");
  if (!ok) { box.textContent = "Lyrics not found."; return; }
  fetch(encodeURI(f), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => {
      const d = new DOMParser().parseFromString(t, "text/html");
      const h = d.querySelector("h1");
      const l = d.querySelector(".lyrics");
      const title = new URLSearchParams(location.search).get("t") || (h ? h.textContent.trim() : "Lyrics");
      document.getElementById("lv-title").textContent = title;
      document.title = title + " - Lyrics - Jimenim Music";
      box.textContent = l ? l.textContent.replace(/\*\*(\[[^\]\n]+\])\*\*/g, "$1").trim() : "Lyrics not found.";
      const back = d.querySelector("a.back, a.back-btn");
      if (back && /spiritual/i.test(back.getAttribute("href") || "")) {
        const b = document.getElementById("lv-back");
        b.href = "/spiritual.html"; b.textContent = "‹ Back to Spiritual";
        document.querySelectorAll(".toplinks a").forEach(a => a.classList.toggle("current", /spiritual/.test(a.getAttribute("href"))));
      }
    })
    .catch(() => { box.innerHTML = 'Could not load these lyrics. <a href="' + encodeURI(f) + '">Open them here</a>.'; });
})();
</script>
